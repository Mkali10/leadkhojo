# Content management systems.
#
# Adding a fingerprint here is a data change: no Python edit, no migration.
# Every addition needs a fixture test AND a false-positive check across the
# existing corpus — a wrong detection costs more trust than a missed one.

- id: wordpress
  name: WordPress
  category: cms
  website: https://wordpress.org
  signals:
    - type: meta_generator
      pattern: 'WordPress\s*([\d.]+)?'
      version_group: 1
      confidence: certain
    - type: html
      pattern: '/wp-content/'
      confidence: certain
    - type: html
      pattern: '/wp-includes/'
      confidence: certain
    - type: header
      name: x-pingback
      pattern: 'xmlrpc\.php'
      confidence: likely

- id: drupal
  name: Drupal
  category: cms
  website: https://drupal.org
  signals:
    - type: meta_generator
      pattern: 'Drupal\s*([\d.]+)?'
      version_group: 1
      confidence: certain
    - type: html
      pattern: '/sites/default/files/'
      confidence: likely
    - type: header
      name: x-drupal-cache
      pattern: '.'
      confidence: certain
    - type: header
      name: x-generator
      pattern: 'Drupal\s*([\d.]+)?'
      version_group: 1
      confidence: certain

- id: joomla
  name: Joomla
  category: cms
  website: https://joomla.org
  signals:
    - type: meta_generator
      pattern: 'Joomla!?\s*([\d.]+)?'
      version_group: 1
      confidence: certain
    - type: html
      pattern: '/media/jui/'
      confidence: likely
    - type: html
      pattern: 'option=com_content'
      confidence: likely

- id: wix
